[package]
name = "screen-buddy"
version = "1.0.0"
description = "Screen Buddy - AI assistant that can see your screen"
authors = ["Kapari"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "screen_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["macos-private-api", "devtools", "tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-oauth = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
# Always-on remote control channel (remote.rs). `connect_async` needs a TLS
# backend for wss://; native-tls matches reqwest's default so we don't pull in a
# second TLS stack.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
urlencoding = "2"
base64 = "0.22"
image = "0.25.5"
enigo = "0.2"
xcap = "0.9.6"
# Native clipboard. Replaces the `pbcopy`/`pbpaste` subprocesses in computer.rs,
# which are macOS-only binaries and simply fail to spawn on Windows.
arboard = "3"
# NOTE: `core-graphics` / `core-foundation` used to be listed here, but nothing
# imports them — `permissions.rs` declares its own `extern "C"` bindings and
# links the system frameworks directly (`#[link(name = "CoreGraphics", kind =
# "framework")]`), which needs no crate. They sat in the UNCONDITIONAL
# dependency block, so they failed the Windows build outright. Deleted rather
# than gated behind cfg(target_os = "macos"): they were dead weight everywhere.
aes-gcm = "0.10"
rand = "0.8"
# Artifact library (artifacts.rs): content-addressed ids (SHA-256 of the file
# bytes, which gives dedup for free) + ISO8601 UTC `created_at` timestamps.
sha2 = "0.10"
chrono = "0.4"
# PDF ingest for pinned sets. Binds to the PDFium dynamic library at RUNTIME
# (Pdfium::bind_to_system_library), so building does not require the dylib.
pdfium-render = { version = "0.8", features = ["image"] }

# macOS credential-vault hardening: store the AES master key in the login
# Keychain (`keyring`) and gate its first read per run behind Touch ID
# (`robius-authentication`). Both are macOS-only; non-macOS uses the file-key
# fallback in credentials.rs, so these are not compiled off-platform.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
robius-authentication = "0.1"
# Objective-C bridge used only by window.rs to call
# `[NSApplication activateIgnoringOtherApps:]`, which is required to steal focus
# from the frontmost app when a scheduled run fires in the background.
objc = "0.2"

# Windows credential-vault hardening — the mirror of the macOS block above.
# `keyring` stores the AES master key in Credential Manager (`windows-native`
# backend, the Win32 credential API — no DBus/secret-service involved), and
# `robius-authentication` gates its first read per run behind Windows Hello.
# Without these, credentials.rs falls through to the plaintext on-disk key file,
# whose `restrict_perms` is a no-op on Windows.
#
# NOTE: window.rs needs NO Windows counterpart to `objc`. tao already implements
# SetForegroundWindow (plus its ALT-synthesis fallback) inside `set_focus()`.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
robius-authentication = "0.1"
# UI Automation grounding PROTOTYPE (uia.rs). Read-only: walks the foreground
# window's accessibility tree so we can see whether real controls report usable
# names and screen rects, instead of the model estimating pixel coordinates off
# a downscaled screenshot. Not wired into the agent loop.
#
# WHY THIS CRATE over the alternative (raw COM through the `windows` crate):
# the whole job is `IUIAutomation` + `IUIAutomationTreeWalker` +
# `IUIAutomationElement`, which by hand means CoCreateInstance, manual
# AddRef/Release discipline on every node of a recursive walk, and BSTR/VARIANT
# marshalling for every property read. That is a few hundred lines of unsafe
# whose bugs are refcount leaks and use-after-free — the worst possible payload
# for a process that already holds the user's screen and input. `uiautomation`
# is a thin, actively maintained safe wrapper (it IS the `windows` crate
# underneath, so no second COM stack) that turns each property into a
# `Result<T>` and gives elements RAII lifetimes. We use maybe eight of its
# methods; the cost is one dependency on the Windows target only, and this is
# the one place in this task where adding a dependency is the point.
#
# NOTE: it brings its own pinned `windows` crate version. uia.rs deliberately
# does NOT add a direct `windows` dependency — the single Win32 call it needs
# (`GetForegroundWindow`) is declared as a one-line extern, so we never have to
# keep two `windows` versions in step.
uiautomation = "0.25"

# Optimize ALL third-party crates even in `tauri dev`/debug builds. `image`
# (and its codecs) is ~157x slower when built unoptimized, which dominates
# screenshot latency. This compiles every dependency at opt-level 3 ONCE and
# caches it; our own crate (top-level [profile.dev]) stays unoptimized so
# incremental rebuilds + hot reload remain fast and debuggable.
[profile.dev.package."*"]
opt-level = 3
